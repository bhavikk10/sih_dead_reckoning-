[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idr-backend"
version = "0.0.0"
description = "Initial Python backend scaffold for the Intelligent Dead Reckoning system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "torch",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "joblib",
    "networkx",
    "osmnx",
    "geopandas",
    "shapely",
    "pyproj",
    "pyrosm",
    "onnx",
    "onnxruntime",
    "matplotlib",
    "pydantic",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/idr_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
